name: release-v2.1.1-security

on:
  push:
    branches:
      - release/v2.1.1-security

permissions:
  contents: write

jobs:
  prepare-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[release-tree-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Refresh Astro production dependency tree
        shell: bash
        run: |
          set -euxo pipefail
          for dir in packages/create-nasu-stack/scaffold/astro packages/create-nasu-stack/scaffold/blog; do
            node - "$dir/package.json" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.dependencies.astro = '^7.2.10';
          j.overrides = { ...(j.overrides || {}), sharp: '^0.35.4' };
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
            (cd "$dir" && npm install astro@7.2.10 --package-lock-only --ignore-scripts)
            (cd "$dir" && npm audit fix --package-lock-only --ignore-scripts)
            (cd "$dir" && npm audit --audit-level=high --omit=dev)
          done

      - name: Set patch release version
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const p of ['package.json', 'packages/create-nasu-stack/package.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (j.version !== '2.1.0') throw new Error(`${p}: expected 2.1.0, got ${j.version}`);
            j.version = '2.1.1';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }

          const stableFiles = [
            'README.md', 'README.ja.md', 'SECURITY.md', 'SECURITY.ja.md',
            'docs/security.md', 'docs/security.ja.md',
            'docs/migration-v2.md', 'docs/migration-v2.ja.md',
            'docs/shadcn-directory.md', 'packages/create-nasu-stack/index.mjs',
            'scripts/_site.mjs'
          ];
          for (const p of stableFiles) {
            let s = fs.readFileSync(p, 'utf8');
            if (!s.includes('2.1.0')) throw new Error(`${p}: expected Stable 2.1.0 reference`);
            s = s.replaceAll('2.1.0', '2.1.1');
            fs.writeFileSync(p, s);
          }

          const changelogPath = 'CHANGELOG.md';
          let c = fs.readFileSync(changelogPath, 'utf8');
          const section = `## [2.1.1] - 2026-09-28\n\nPatch release. It refreshes the Astro starter dependency tree after newly\npublished security advisories caused the weekly production-dependency audit to fail.\n\n### Security\n\n- Raise the Astro security floor from 7.2.2 to 7.2.10\n- Raise the Sharp override from 0.35.3 to 0.35.4\n- Refresh transitive dependencies in the Astro/Blog lockfile so the production\n  audit contains no high-or-higher known vulnerabilities\n\n`;
          c = c.replace('## [Unreleased]\n\n', '## [Unreleased]\n\n' + section);
          c = c.replace('[2.1.0]: https://github.com/Nasu726/Nasu-Stack/compare/v2.0.1...v2.1.0',
            '[2.1.1]: https://github.com/Nasu726/Nasu-Stack/compare/v2.1.0...v2.1.1\n[2.1.0]: https://github.com/Nasu726/Nasu-Stack/compare/v2.0.1...v2.1.0');
          fs.writeFileSync(changelogPath, c);
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm registry:build
      - name: Verify repository
        run: pnpm verify
      - name: Verify generated projects
        run: pnpm verify:create
      - name: Verify release asset
        run: pnpm release:build v2.1.1

      - name: Commit verified release tree
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: prepare v2.1.1 security patch [release-tree-ready]'
          git push origin HEAD:release/v2.1.1-security
