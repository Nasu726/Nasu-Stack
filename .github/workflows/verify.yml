name: verify

on:
  push:
    branches: [main]
  pull_request:
  # 依存を更新していなくても、週 1 で外部要因の破損に気づけるようにする
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  # pages.yml から呼び出せるようにする。
  # **配るものは、検査を通ったものだけ**にするためです。
  workflow_call:

# ------------------------------------------------------------------
# 既定の権限を落とす
# ------------------------------------------------------------------
# 書かないとリポジトリの既定を継承します。既定が read-write のままだと、
# 依存やアクションのどれか 1 つが乗っ取られたときに、
# GITHUB_TOKEN でこのリポジトリ自体を書き換えられます。
# この検査は読むだけなので contents: read で足ります。
# ------------------------------------------------------------------
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ----------------------------------------------------------------
      # アクションは commit SHA で固定します
      # ----------------------------------------------------------------
      # `@v4` はタグで、**タグは動きます。** 上流が乗っ取られてタグを
      # 付け替えられたら、こちらは何も変えていないのに次の CI から
      # 別のコードが走ります。しかも CI は他人のコードを
      # 書き込み権限のあるトークンの隣で実行する場所です。
      #
      # 読めなくなるので、対応するタグをコメントに残します。
      # 更新は Renovate に追随させます（v0.9b で配線）。
      # ----------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 実ブラウザでの検証に使う
      - name: Chromium を用意
        run: pnpm exec playwright install --with-deps chromium

      # 型検査・ビルド・配布物・実ブラウザ検証をまとめて実行
      - name: verify
        run: pnpm verify

      - name: 失敗時にスクリーンショットを残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          # 置き場は scripts/_browser.mjs の SHOTS_DIR と同じ .shots です。
          # ここに別の場所を書くと、失敗したときだけ「記録が無い」ことに
          # 気づくことになります（実際そうなっていました）。
          path: |
            .shots
            apps/*/dist
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------
  # 利用者が実際に踏む経路
  # ----------------------------------------------------------------
  # `verify` だけでは足りません。生成物の `npm install` → `npm run build`
  # → 実ブラウザ → 部品の追加は `verify:create` にしかありません。
  #
  # v0.9c まで、これは **main へマージしたあと（公開の直前）にしか
  # 走りませんでした。** つまり気づくのがマージの後です。
  # public リポジトリは runner が無料なので、代償は待ち時間だけです。
  #
  # 定義はここ 1 か所です。`pages.yml` は workflow_call で呼びます。
  # ----------------------------------------------------------------
  verify-create:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 生成物が要求する下限。**ここで確かめないと意味がありません。**
          # 案内より新しい版でだけ通る状態になっていても気づけません。
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium を用意
        run: pnpm exec playwright install --with-deps chromium

      # レジストリは「本物の CLI で部品を足せるか」の判定が使います
      - name: レジストリを生成
        run: pnpm registry:build

      - name: 生成物を npm で install / build / 実ブラウザ
        run: pnpm verify:create
