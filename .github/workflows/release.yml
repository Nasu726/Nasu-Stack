name: release

# tagはrelease PRをmainへmergeし、Pagesの公開先smokeが成功してから打ちます。
# PR headを先にreleaseしません。
on:
  push:
    tags:
      - "v*.*.*"

# 検査は読むだけ。Releaseへ書く権限は最後のjobだけに渡します。
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tagの内容がmainに含まれ、同じSHAのPages公開smokeが成功済みでなければ
      # Releaseを作りません。tag内容のverifyだけでは「公開確認したcommit」と
      # 「配るcommit」が同じことを証明できないためです。
      - name: main公開smoke済みcommitか確認する
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow pages.yml --branch main --commit "${GITHUB_SHA}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "${run_id}"
        env:
          GH_TOKEN: ${{ github.token }}

      # tagとpackage versionが違えばassetを作る前に止まります。
      - name: versioned assetを組み立てる
        run: pnpm release:build "${GITHUB_REF_NAME}"

      # gh release createへassetを同時に渡すと、draftへ添付してからpublishします。
      # repositoryのImmutable Releasesを保ったまま、公開後にassetを足す経路を作りません。
      # createは既存Releaseを上書きせず、同じtagが存在すれば明示的に失敗します。
      - name: GitHub Releaseを作る
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "Nasu Stack ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
