packages:
  - "apps/*"
  - "packages/*"

# ------------------------------------------------------------------
# 公開直後の版を掴まない
# ------------------------------------------------------------------
# `--frozen-lockfile` が守るのは「lockfile の通りに入れる」ところだけです。
# **lockfile を書き換える瞬間**——依存を更新する PR——は守りません。
# npm への攻撃はそこを狙います。乗っ取ったアカウントから版を publish し、
# 誰かの更新に紛れ込むのを待つ形です。
#
# 実例はどれも「公開されてから取り下げられるまで」が短時間でした。
# だから 3 日待つだけで大半をやり過ごせます。新しい版がすぐ要る場面は
# このリポジトリにはありません（脆弱性の修正が要るときは
# minimumReleaseAgeExclude に名指しで足してください）。
# ------------------------------------------------------------------
minimumReleaseAge: 4320 # 分。= 3 日

# ------------------------------------------------------------------
# 依存のインストール時スクリプトを、名指しで許可制にする
# ------------------------------------------------------------------
# postinstall は「依存を入れただけ」で任意のコードが動く場所です。
# pnpm 10 の既定は「走らせない」ですが、**既定は変わりえます。**
# 明示しておけば意図が固定されます。
#
# 現在このリポジトリは 1 つも必要としていません。
# esbuild は同梱のバイナリで動き、sharp は使っていません
# （画像は passthroughImageService。native の依存を増やさない判断です）。
#
# **全部を黙らせるのではありません。** ここに書いていないものが新しく
# スクリプトを要求してきたら、そのときは pnpm が知らせてきます。
# それが本当に見たい合図です（毎回出る警告は、やがて誰も読まなくなります）。
#
# 旧来の `onlyBuiltDependencies` / `ignoredBuiltDependencies` は
# **pnpm 11 で削除されます。** 依存更新で pnpm が上がったときに
# 黙って効かなくなるので、10.26 以降の `allowBuilds` で書きます。
# ------------------------------------------------------------------
allowBuilds:
  esbuild: false
  sharp: false

# ------------------------------------------------------------------
# 使っていないのに入ってくる依存を、安全な版に寄せる
# ------------------------------------------------------------------
# `sharp` は astro の optionalDependency です。このリポジトリは
# `passthroughImageService()` を使っていて **sharp を一度も呼びません**が、
# 入っている以上は脆弱性の対象になります（実際 Dependabot が 0.34.5 を
# high として報告しました。0.34 系に修正版はありません）。
#
# 呼ばないから放置、はしません。**入っているものは全部、供給連鎖の一部です。**
# ------------------------------------------------------------------
overrides:
  sharp: "^0.35.3"
